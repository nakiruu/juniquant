[workspace]
resolver = "3"
members = ["symbols", "calendar", "lake", "ingest"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
publish = false

# Shared dependency versions; member crates opt in with `<name>.workspace = true`.
[workspace.dependencies]
arrow = { version = "60.0.0", default-features = false, features = ["ipc"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
csv = "1"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
proptest = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "gzip"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
pdf_oxide = { version = "0.3.78", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.8"
zstd = "0.14.2"

# Quality bar (docs/INFRASTRUCTURE-PLAN.md §2): no unwrap/expect/panic in library code.
# Tests may unwrap (clippy.toml).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"

# The Julia side shells out to `lake-io` (cargo build --release -p lake); Arrow and ZSTD work is
# much slower unoptimised. The execution binary will want the same.
[profile.release]
lto = "fat"
codegen-units = 1
