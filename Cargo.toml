[workspace]
resolver = "3"
members = ["symbols", "calendar", "lake", "ingest"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
publish = false

# Quality bar (docs/INFRASTRUCTURE-PLAN.md §2): no unwrap/expect/panic in library code.
# Tests may unwrap (clippy.toml).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"

# Shared dependency versions; member crates use `dep = { workspace = true }`.
[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
csv = "1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"
