# Canonical symbol map (09-lock-state-machine SKILL.md section 3.8). SHAPE ONLY, not seeded.
# Loaded by the shared `symbols` crate (normalize/render/is_tradable: 01-data-ingestion UNIVERSE.md section 3).
# One source of truth for how a company's ticker is spelled in each source. Implemented in Rust
# (the `symbols` crate; execution/ wraps it); used by the lock history loader, the restricted list, the
# fractional list, the order generator and the snapshot writer. Julia reads this same file read-only.
# Seed it from universe.parquet and review it by hand; every spelling below is a `verify` item.
# An UNMAPPED ticker is not tradable (fail closed, audited). Two entries claiming one Schwab spelling
# make the map invalid: every lock check then denies until it is fixed.
#
# [[symbol]]
# canonical  = "BRK.B"            # the form used inside the system
# eodhd      = "BRK-B"            # primary price source, sent as BRK-B.US (verify, P3)
# yahoo      = "BRK-B"            # verify
# ishares    = "BRKB"             # verify
# schwab     = "BRK/B"            # verify
# lock_group = "BRK"              # share classes of one issuer (security_master CIK) share a group (DECISIONS B1)
# aliases    = []                 # old tickers after a rename, e.g. [{ symbol = "OLD", until = "2022-06-09" }]
#                                 # optional alias `from` (inclusive) when the string had an earlier holder
#
# Ticker reuse (DECISIONS B5): if another security later lists under an old ticker, its entry
# gets `from`, the first date it holds the string. Holdings of one string must not overlap,
# and every alias must match security_master.prior_tickers, or the map fails to load.
#
# [[symbol]]
# canonical  = "OLD"              # a different issuer reusing the ticker
# from       = "2024-03-01"       # after the old holder's alias `until`
# lock_group = "NEWISSUER"
#
# [[symbol]]
# canonical  = "GOOGL"
# eodhd      = "GOOGL"
# yahoo      = "GOOGL"
# ishares    = "GOOGL"
# schwab     = "GOOGL"
# lock_group = "ALPHABET"         # GOOG and GOOGL are different securities in the same lock group (decided, DECISIONS B1)
