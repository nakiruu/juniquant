# SIC code -> GICS sector, used ONLY when an iShares holdings row has no usable
# sector (01-data-ingestion/UNIVERSE.md §6). The result is flagged
# `sector_source = sic_fallback` in `universe`.
#
# Rule: the narrowest [from, to] range (inclusive, 4-digit SIC) containing the
# code wins; ties are a config error. A code in no range leaves `sector` null.
# SIC and GICS do not map one to one; ambiguous groups go to the sector most of
# their large-cap members carry. Owner-reviewable; changes are committed.
#
# Sector labels must be exactly the 11 GICS sector names below.
# Communication Services, Consumer Discretionary, Consumer Staples, Energy,
# Financials, Health Care, Industrials, Information Technology, Materials,
# Real Estate, Utilities

version = 1

# --- Division A: agriculture, forestry, fishing
[[range]]
from = 100
to = 999
sector = "Consumer Staples"

[[range]]
from = 800
to = 899
sector = "Materials" # forestry

# --- Division B: mining
[[range]]
from = 1000
to = 1099
sector = "Materials" # metal mining

[[range]]
