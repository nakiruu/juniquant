# Owner reviews of G2 ten-fold jumps (01-data-ingestion/QUALITY-GATES.md G2). Read by
# `quant-ingest gates g2`; a FIGI without prices is an error.
#
# [[accept]]   a real move: the jump on `date` is not counted and its bars stay.
# figi = "BBG000XXXXXX"
# date = "2020-09-23"
# note = "why"
#
# [[exclude]]  bad data: G2 rejects the bars from `from` to `to` (reason `reviewed`), so
# `universe` excludes those rows.
# figi = "BBG000XXXXXX"
# from = "2014-08-13"
# to   = "2014-12-31"
# note = "why"

# Owner review 2026-10-12 (facts from the owner, ranges from the bars).

[[exclude]]  # AGII: Argo changed its ticker to ARGO in May 2018; the AGII bars after are another security's (~$600)
figi = "BBG000F4HLT8"
from = "2018-05-07"
to   = "2020-10-08"
note = "Argo renamed AGII -> ARGO; later AGII bars are not Argo"

[[exclude]]  # AIP: Arteris listed in October 2021; the bars before (~$5,000) are another security's
figi = "BBG000QMLTK3"
from = "2008-08-25"
to   = "2021-10-26"
note = "Arteris IPO 2021-10-27"

[[exclude]]  # ALR: Five Star / AlerisLife, years scaled x10 for the 2019 1:10 split, 2016-2017 Alere's closes, 2018 to 2022-01-27 a stale 50.99 with no volume
figi = "BBG000BJRQT7"
from = "2005-01-03"
to   = "2022-01-27"
note = "split-scaled years mixed with Alere quotes and a stale price"

[[exclude]]  # AOI: from the day it became Pyxus the bars drop 18x to ~$1.3; no split in the data or the filings explains it
figi = "BBG00X4SNW78"
from = "2018-09-12"
to   = "2020-10-08"
note = "owner: split; no split matches, bars after the Pyxus rename excluded"

[[exclude]]  # ASRT: Depomed renamed Assertio; the vendor scaled Depomed's history (x60 in 2007-2016, other factors before and after)
figi = "BBG000C1TJH2"
from = "2005-01-03"
to   = "2018-08-14"
note = "Depomed history mis-scaled by the vendor"
