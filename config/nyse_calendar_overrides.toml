# Ad-hoc NYSE full-day closures that the holiday RULES cannot predict (national days of
# mourning, disasters). Unioned with the computed rules (09-lock-state-machine SKILL.md section 4).
# This is the checked-in SEED. The runtime copy at $QUANT_STATE/nyse_calendar_overrides.toml
# (container /state; host /mnt/cache/appdata/quant/) is written only by `calendar-sync` (on the FIRST
# sighting, today included) and by the owner's `quant-exec calendar add`. It only ever ADDS dates:
# treating an extra date as closed can only lengthen a lock block, never shorten it. No code removes a line.
# Runtime entries carry extra keys: added_on, first_seen, source ("schwab_marketdata" |
# "same_day_signal" | "price_bar_backfill" | "manual"). The seed covers the backfill window (prices
# from 2005-01-01, macro from 2004-01-01; owner decision D7) plus the September 2001 closures, which
# the one-time historical price-bar backfill (09 SKILL.md section 4) should rediscover. Each
# historical entry: VERIFY against NYSE notices.
# Must stay identical to OVERRIDES_SEED in .claude/skills/09-lock-state-machine/scripts/nyse_calendar_oracle.jl.

